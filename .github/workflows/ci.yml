name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No database here, so migrations are skipped; this checks the app compiles.
      - run: npm run build

  # The browser suite: a real Chromium against the built app, with stand-ins
  # for Google, Microsoft, email and webhooks and a real CalDAV server.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in step with the Playwright the specs were written against.
      PLAYWRIGHT_VERSION: 1.63.0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calendi
          POSTGRES_PASSWORD: calendi
          POSTGRES_DB: calendi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calendi -d calendi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser, psql and a CalDAV server
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          python3 -m venv "$RUNNER_TEMP/radicale"
          "$RUNNER_TEMP/radicale/bin/pip" install --quiet radicale
          echo "RADICALE_PYTHON=$RUNNER_TEMP/radicale/bin/python" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Keep screenshots and logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.out
          if-no-files-found: ignore
